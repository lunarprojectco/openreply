# OpenReply — nginx reverse proxy.
#
# TLS certificate paths are left as placeholders; issue with certbot or drop in
# your own. Nothing here contains a secret.

server {
    listen 80;
    listen [::]:80;
    server_name openreply.example.com;

    # ACME http-01 lives here if you use certbot --webroot.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openreply.example.com;

    ssl_certificate     /etc/letsencrypt/live/openreply.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openreply.example.com/privkey.pem;

    # Meta posts media-bearing payloads; the default 1m is too small for some
    # webhook bodies and for asset uploads from the dashboard.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
    }

    # The Meta webhook is signature-verified over the RAW body. Anything that
    # rewrites, re-encodes or recompresses the body breaks X-Hub-Signature-256
    # and every event is rejected as a forgery — with no obvious cause in the
    # logs. Keep this location free of body-altering directives.
    location /api/webhook {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hand the body through untouched.
        proxy_request_buffering off;
        proxy_buffering off;

        # Meta gives up quickly; a slow handler costs delivery, not just latency.
        proxy_read_timeout 30s;
    }
}
